name: CI

on:
  workflow_dispatch:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: 'npm'

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: npm ci

      - name: Audit npm dependency tree
        run: npm audit --audit-level=high

      - name: Run TypeScript typecheck
        run: npm run typecheck

      - name: Run linter
        run: npm run lint

      - name: Run tests with 80% coverage thresholds
        run: npm run test:coverage

      - name: Run Python tests
        run: npm run test:python

      - name: Run production build
        run: npm run build

      - name: Install Chromium
        run: npx playwright install --with-deps --only-shell chromium

      - name: Run deterministic Evidence Assistance browser smoke
        run: npm run test:browser:assistance
        timeout-minutes: 5

      - name: Run deterministic local-loop browser smoke
        run: npm run test:browser:release
        timeout-minutes: 5
